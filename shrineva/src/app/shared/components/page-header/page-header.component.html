<header class="theme-dark relative isolate overflow-hidden bg-ink pt-[calc(var(--nav-h)+2.5rem)] pb-12 md:pb-16">
  <!-- backdrop: night façade, heavily dimmed, plus a brass glow -->
  <img src="assets/images/hero/hero-night-1000.webp" alt="" aria-hidden="true" width="1000" height="667"
       class="absolute inset-0 -z-10 h-full w-full object-cover object-[50%_30%] opacity-[0.22]" fetchpriority="low">
  <div class="absolute inset-0 -z-10 bg-gradient-to-b from-ink/60 via-ink/70 to-ink" aria-hidden="true"></div>
  <div class="absolute -top-32 right-[-10%] -z-10 size-[34rem] rounded-full bg-brass/20 blur-[110px]" aria-hidden="true"></div>
  <div class="absolute inset-0 -z-10 bg-grid bg-[length:56px_56px] [mask-image:radial-gradient(ellipse_at_top,#000,transparent_70%)] opacity-60" aria-hidden="true"></div>

  <div class="container-srineva">
    <button type="button" class="group mb-8 inline-flex min-h-[44px] items-center gap-2 text-[0.82rem] font-semibold text-paper/70 transition-colors hover:text-paper" (click)="goBack()" aria-label="Go back to previous page">
      <span class="transition-transform duration-300 group-hover:-translate-x-1" aria-hidden="true">←</span> Back
    </button>
    <span class="eyebrow" *ngIf="eyebrow">{{ eyebrow }}</span>
    <h1 class="max-w-4xl font-display text-display-xl text-paper animate-rise">{{ title }}</h1>
    <p class="mt-5 max-w-2xl text-[1.05rem] leading-relaxed text-paper/75 animate-rise [animation-delay:120ms]" *ngIf="subtitle">{{ subtitle }}</p>
  </div>
</header>
