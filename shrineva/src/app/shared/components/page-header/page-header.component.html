<header class="theme-soft relative isolate overflow-hidden border-b border-paper/10 bg-ink pt-[calc(var(--nav-h)+1rem)] pb-8 md:pb-10">
  <div class="absolute -top-24 right-[-8%] -z-10 size-[26rem] rounded-full bg-brass/15 blur-[110px]" aria-hidden="true"></div>
  <div class="container-srineva">
    <button type="button" class="group mb-3 inline-flex min-h-[40px] items-center gap-2 text-[0.8rem] font-semibold text-paper/70 transition-colors hover:text-paper" (click)="goBack()" aria-label="Go back to previous page">
      <span class="transition-transform duration-300 group-hover:-translate-x-1" aria-hidden="true">←</span> Back
    </button>
    <span class="eyebrow !mb-2" *ngIf="eyebrow">{{ eyebrow }}</span>
    <h1 class="max-w-3xl font-display text-display-lg text-paper animate-rise">{{ title }}</h1>
    <p class="mt-3 max-w-2xl text-[1rem] leading-relaxed text-paper/70 animate-rise [animation-delay:120ms]" *ngIf="subtitle">{{ subtitle }}</p>
  </div>
</header>
