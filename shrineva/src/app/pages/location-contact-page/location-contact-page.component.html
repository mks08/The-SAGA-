<main id="main-content" role="main">
  <app-page-header
    eyebrow="Location & site visit"
    title="Location, Map & Site Visit"
    subtitle="Plot D-15 on a 24 m wide north-facing road, Bada Lalpur, Varanasi: opposite the upcoming Apollo Hospital and about 100 m from NIFT Varanasi.">
  </app-page-header>

  <section class="bg-paper py-10 md:py-14" aria-labelledby="where-title">
    <div class="container-srineva grid items-start gap-8 lg:grid-cols-[0.9fr_1.1fr]">
      <div>
        <h2 id="where-title" class="font-display text-display-md text-ink">Where is SHRINEVA?</h2>
        <address class="mt-3 max-w-md text-[1.02rem] not-italic leading-relaxed text-ink/80">{{ property.address.full }}</address>
        <dl class="mt-5 grid max-w-md gap-3 text-[0.95rem]">
          <div class="rounded-2xl border border-ink/10 bg-white p-4">
            <dt class="font-mono text-[0.62rem] uppercase tracking-[0.16em] text-brass-deep">Leasing desk</dt>
            <dd class="mt-1 grid gap-1 font-semibold text-ink">
              <a [href]="'tel:' + property.contact.phoneE164" class="flex min-h-[44px] items-center">{{ property.contact.phoneDisplay }}</a>
              <a [href]="'tel:' + property.contact.phone2E164" class="flex min-h-[44px] items-center">{{ property.contact.phone2Display }}</a>
              <a [href]="waHref" target="_blank" rel="noopener" class="flex min-h-[44px] items-center text-[#0b7a3b]">WhatsApp {{ property.contact.whatsappDisplay }}</a>
              <a *ngIf="property.contact.publicEmail" [href]="'mailto:' + property.contact.publicEmail" class="flex min-h-[44px] items-center break-all text-brass-deep underline underline-offset-4">{{ property.contact.publicEmail }}</a>
            </dd>
          </div>
        </dl>
        <div class="mt-5 flex flex-col gap-3 sm:flex-row">
          <a [href]="links.directions" target="_blank" rel="noopener" class="btn-primary justify-center">Get directions <span class="arrow" aria-hidden="true">↗</span></a>
          <a href="#enquiry" class="btn-outline justify-center">Book a site visit</a>
        </div>
      </div>
      <app-commercial-lead-form anchorId="enquiry" heading="Book a site visit or request leasing details"
        intro="Tell us about your business and when you would like to visit. We will call to confirm a time."></app-commercial-lead-form>
    </div>
  </section>

  <app-place-map [showIntro]="false"></app-place-map>
  <app-residential-lead-form></app-residential-lead-form>
  <app-faq [items]="faqs" heading="Location, visit and building status" headingId="loc-faq-title"></app-faq>
</main>
