<section class="theme-soft relative isolate overflow-hidden bg-ink py-9 md:py-12" aria-labelledby="fcta-title">
  <div class="absolute left-1/2 top-0 -z-10 size-[26rem] -translate-x-1/2 rounded-full bg-brass/15 blur-[110px]" aria-hidden="true"></div>
  <div class="container-srineva text-center">
    <div appReveal>
      <h2 id="fcta-title" class="mx-auto max-w-2xl font-display text-display-md text-paper">A space for your <em class="text-brass-soft">next move.</em></h2>
      <p class="mx-auto mt-3 max-w-md text-[0.98rem] text-paper/70">Tell us what your business needs and we will suggest the right floor.</p>
      <div class="mt-6 flex flex-col items-stretch justify-center gap-3 sm:flex-row sm:items-center">
        <button type="button" class="btn-primary" (click)="openPopup()">Schedule a visit <span class="arrow" aria-hidden="true">→</span></button>
        <a routerLink="/contact" class="btn-outline">Request leasing details</a>
      </div>
      <p class="mt-4 flex flex-wrap items-center justify-center gap-x-5 text-[0.9rem] text-paper/80">
        <a [href]="waHref" target="_blank" rel="noopener" class="inline-flex min-h-[44px] items-center font-bold text-brass-soft hover:underline">WhatsApp</a>
        <a [href]="'tel:' + property.contact.phoneE164" class="inline-flex min-h-[44px] items-center hover:underline">{{ property.contact.phoneDisplay }}</a>
      </p>
    </div>
  </div>
</section>
