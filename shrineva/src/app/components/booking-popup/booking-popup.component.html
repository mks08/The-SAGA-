<div class="popup-overlay fixed inset-0 z-[1200] grid place-items-end bg-ink/55 backdrop-blur-sm sm:place-items-center sm:p-6" *ngIf="show" (click)="onOverlayClick($event)" role="dialog" aria-modal="true" [attr.aria-label]="txt.dialog" [attr.lang]="hindi ? 'hi' : null">
  <div #card class="popup-card theme-light relative w-full max-w-[27rem] overflow-hidden rounded-t-3xl bg-white text-ink shadow-lift animate-rise sm:rounded-3xl">

    <button type="button" class="popup-close absolute right-2.5 top-2.5 z-20 grid size-11 place-items-center rounded-full bg-ink/[0.08] text-ink hover:bg-ink/15" (click)="close()" [attr.aria-label]="txt.close">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="max-h-[92dvh] overflow-y-auto p-5 pb-6 pt-14 sm:p-7 sm:pt-14">
      <app-lead-form [(path)]="path" [context]="context" [source]="source" [category]="category" [message]="message" [hindi]="hindi"
                     [showTabs]="true" idPrefix="dlg" [headingLevel]="2"></app-lead-form>
    </div>
  </div>
</div>
