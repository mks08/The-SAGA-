<header class="theme-soft fixed inset-x-0 top-0 z-50" role="banner">
  <!-- Bar background lives on its own layer: a backdrop-filter on the header itself would trap the fixed mobile menu inside the 72px bar. -->
  <div class="pointer-events-none absolute inset-0 -z-10 border-b transition-[background-color,border-color,backdrop-filter] duration-500 ease-out"
       [ngClass]="scrolled || menuOpen ? 'bg-ink/80 backdrop-blur-xl border-paper/10' : 'bg-transparent border-transparent'" aria-hidden="true"></div>

  <!-- Reading progress -->
  <div class="absolute bottom-[-1px] left-0 h-px bg-brass origin-left" [style.width.%]="scrollProgress" aria-hidden="true"></div>

  <div class="container-srineva flex h-[var(--nav-h)] items-center justify-between gap-4">
    <!-- Logo -->
    <a routerLink="/" class="group flex items-center gap-3 min-h-[44px]" (click)="closeMenu()">
      <img src="assets/images/logo-mark.webp" alt="" width="44" height="44"
           class="size-11 rounded-xl ring-1 ring-brass/40 transition-transform duration-500 ease-out group-hover:rotate-[-4deg] group-hover:scale-105">
      <span class="flex flex-col leading-none">
        <span class="font-display text-[1.55rem] tracking-[0.14em] text-paper">SHRINEVA</span>
        <span class="mt-1 whitespace-nowrap font-mono text-[0.56rem] uppercase tracking-[0.2em] text-brass-soft/90">Commercial &amp; mixed-use · Varanasi</span>
      </span>
      <span class="sr-only">, home</span>
    </a>

    <!-- Desktop links -->
    <nav class="hidden xl:flex items-center gap-0.5" aria-label="Main navigation">
      <a *ngFor="let link of navLinks" [routerLink]="link.path" routerLinkActive="!text-paper [&>.bar]:scale-x-100" [routerLinkActiveOptions]="{ exact: link.path === '/' }"
         class="relative inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-2 text-[0.84rem] font-semibold text-paper/70 transition-colors hover:text-paper">
        <span *ngIf="link.live" class="live-dot" aria-hidden="true"></span>
        {{ link.label }}
        <span class="bar absolute inset-x-2.5 -bottom-0.5 h-px origin-left scale-x-0 bg-brass transition-transform duration-500 ease-out" aria-hidden="true"></span>
      </a>
    </nav>

    <!-- Actions -->
    <div class="hidden xl:flex items-center gap-2">
      <a [href]="'tel:' + property.contact.phoneE164" class="btn-ghost btn-sm hidden whitespace-nowrap text-paper/85 2xl:inline-flex" (click)="track('phone_click')" aria-label="Call the leasing team">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
        {{ property.contact.phoneDisplay }}
      </a>
      <button id="nav-book-cta" type="button" class="btn-primary btn-sm !whitespace-nowrap" (click)="openPopup()">
        Schedule a visit <span class="arrow" aria-hidden="true">→</span>
      </button>
    </div>

    <!-- Hamburger -->
    <button type="button" class="xl:hidden grid size-11 place-items-center rounded-full border border-paper/20 text-paper" [class.open]="menuOpen"
            (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-controls="mobile-menu" aria-label="Toggle navigation">
      <span class="grid gap-[5px]" aria-hidden="true">
        <span class="hamburger-line block h-px w-5 bg-current"></span>
        <span class="hamburger-line block h-px w-5 bg-current"></span>
        <span class="hamburger-line block h-px w-5 bg-current"></span>
      </span>
    </button>
  </div>

  <!-- Mobile menu -->
  <div id="mobile-menu"
       class="xl:hidden fixed inset-x-0 top-[var(--nav-h)] bottom-0 overflow-y-auto bg-ink transition-[opacity,transform] duration-500 ease-out"
       [ngClass]="menuOpen ? 'opacity-100 translate-y-0 pointer-events-auto' : 'opacity-0 -translate-y-3 pointer-events-none'"
       [attr.aria-hidden]="!menuOpen" [attr.inert]="menuOpen ? null : ''">
    <nav class="container-srineva pb-28 pt-6" aria-label="Mobile navigation">
      <a *ngFor="let link of navLinks; let i = index" [routerLink]="link.path" routerLinkActive="!text-brass-soft" [routerLinkActiveOptions]="{ exact: link.path === '/' }" (click)="closeMenu()"
         class="flex items-baseline gap-4 border-b border-paper/10 py-3.5 font-display text-[1.7rem] leading-none text-paper"
         [style.transition-delay]="menuOpen ? (i * 40) + 'ms' : '0ms'">
        <span class="font-mono text-[0.66rem] tracking-widest text-brass-soft">0{{ i + 1 }}</span>
        <span>{{ link.label }}</span>
        <span *ngIf="link.live" class="live-dot self-center" aria-hidden="true"></span>
      </a>
      <div class="mt-8 grid gap-3">
        <button type="button" class="btn-primary w-full" (click)="openPopup()">Schedule a visit <span class="arrow" aria-hidden="true">→</span></button>
        <a [href]="waHref" class="btn-whatsapp w-full" target="_blank" rel="noopener" (click)="track('whatsapp_click')">WhatsApp leasing</a>
        <div class="mt-3 grid gap-2 text-[0.95rem] text-paper/80">
          <a [href]="'tel:' + property.contact.phoneE164" class="min-h-[44px] flex items-center">{{ property.contact.phoneDisplay }}</a>
          <a [href]="'tel:' + property.contact.phone2E164" class="min-h-[44px] flex items-center">{{ property.contact.phone2Display }}</a>
          <a *ngIf="property.contact.publicEmail" [href]="'mailto:' + property.contact.publicEmail" class="min-h-[44px] flex items-center text-brass-soft">{{ property.contact.publicEmail }}</a>
        </div>
      </div>
    </nav>
  </div>
</header>
