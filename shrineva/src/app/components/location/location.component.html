<section class="location-section" id="location-section" aria-label="Address and map" [class.no-intro]="!showIntro">
  <div class="container-srineva">
    <div class="section-header" *ngIf="showIntro">
      <span class="section-eyebrow">Address &amp; Map</span>
      <h2 class="section-heading">Find <em>SHRINEVA</em></h2>
    </div>

    <div class="location-layout">
      <div class="location-info">
        <div class="loc-address-card">
          <div>
            <div class="loc-label">Address</div>
            <address class="loc-address">{{ property.address.full }}</address>
            <p class="loc-meta">North-facing plot · {{ plan.plot.frontage }} frontage · {{ plan.plot.roadWidthM }} m wide road</p>
          </div>
        </div>
        <div class="loc-actions">
          <a [href]="property.address.googleMapsUrl" target="_blank" rel="noopener" class="btn-outline">Open in Google Maps</a>
          <button type="button" class="btn-primary" (click)="openPopup()">Schedule a site visit →</button>
        </div>
        <p class="loc-note">The map shows the Bada Lalpur area. An exact pin is added once the final location is confirmed.</p>
      </div>

      <div class="location-map">
        <div class="map-wrapper">
          <iframe
            [src]="mapEmbedUrl"
            width="100%"
            height="100%"
            style="border:0;"
            allowfullscreen="true"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Map of Bada Lalpur, Chandmari, Varanasi, the area of SHRINEVA">
          </iframe>
        </div>
      </div>
    </div>
  </div>
</section>
