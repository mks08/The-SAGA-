<section class="section-py occupier-section" id="advantage" aria-label="What matters to occupiers">
  <div class="container-srineva">
    <div class="occ-intro reveal">
      <span class="section-eyebrow">The SHRINEVA Advantage</span>
      <h2 class="section-heading">What Matters to <em>Occupiers</em></h2>
      <p class="section-sub">Eight decision factors expansion teams typically evaluate before taking a commercial floor.</p>
      <div class="gold-divider"></div>
    </div>

    <ol class="occ-grid">
      <li class="reveal" *ngFor="let f of factors; let i = index" [style.transitionDelay]="(i * 0.06) + 's'">
        <span class="occ-num">0{{ i + 1 }}</span>
        <h3>{{ f.title }}</h3>
        <p>{{ f.copy }}</p>
      </li>
    </ol>
  </div>
</section>
