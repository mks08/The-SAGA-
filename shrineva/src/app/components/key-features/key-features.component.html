<section id="features" data-rail="Features" class="relative bg-paper py-9 md:py-14" aria-labelledby="kf-title">
  <div class="container-srineva">
    <div appReveal class="max-w-xl">
      <span class="eyebrow">Key features</span>
      <h2 id="kf-title" class="font-display text-display-md text-ink">Open, safe and <em class="text-brass-deep">flexible.</em></h2>
    </div>

    <ul class="mt-5 grid grid-cols-2 gap-2.5 md:grid-cols-4 md:gap-3">
      <li *ngFor="let f of features; let i = index" appReveal [style.--i]="i" class="flex items-center gap-3 rounded-xl border border-ink/10 bg-white p-3 md:items-start md:p-3.5">
        <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-brass/12 text-brass-deep" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="f.icon"/></svg>
        </span>
        <div class="min-w-0">
          <h3 class="text-[0.94rem] font-bold leading-snug text-ink" style="font-family: var(--font-sans); letter-spacing: 0;">{{ f.title }}</h3>
          <p class="mt-0.5 hidden text-[0.8rem] leading-snug text-ink/65 md:block">{{ f.line }}</p>
        </div>
      </li>
      <li appReveal [style.--i]="7" class="col-span-2 rounded-xl border border-dashed border-brass-deep/40 bg-brass/[0.06] p-3.5 md:col-span-1">
        <p class="font-mono text-[0.62rem] uppercase tracking-[0.14em] text-brass-deep">Building services</p>
        <ul class="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-[0.9rem] font-semibold text-ink md:grid md:gap-1.5">
          <li *ngFor="let s of services" class="flex items-center gap-2"><span class="size-1.5 rounded-full bg-brass" aria-hidden="true"></span>{{ s }}</li>
        </ul>
      </li>
    </ul>
    <p class="mt-3 text-[0.74rem] text-ink/70">{{ note }}</p>

    <!-- Project status -->
    <div appReveal class="mt-8 flex flex-col gap-4 rounded-2xl border border-ink/10 bg-white p-4 md:flex-row md:items-center md:justify-between md:gap-8 md:p-5" role="group" aria-label="Project status">
      <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
        <p class="flex items-center gap-2 font-mono text-[0.66rem] uppercase tracking-[0.14em] text-brass-deep"><span class="live-dot" aria-hidden="true"></span> Project status</p>
        <dl class="flex flex-wrap gap-x-7 gap-y-2">
          <div><dt class="font-mono text-[0.58rem] uppercase tracking-[0.12em] text-ink/70">Stage</dt><dd class="text-[0.92rem] font-bold text-ink">{{ status.stage }}</dd></div>
          <div><dt class="font-mono text-[0.58rem] uppercase tracking-[0.12em] text-ink/70">Progress</dt><dd class="text-[0.92rem] font-bold text-ink">{{ status.progress }}</dd></div>
          <div><dt class="font-mono text-[0.58rem] uppercase tracking-[0.12em] text-ink/70">Handover</dt><dd class="text-[0.92rem] font-bold text-ink">{{ status.handover }}</dd></div>
        </dl>
      </div>
      <p class="max-w-sm text-[0.86rem] leading-snug text-ink/70">{{ status.modifications }} <button type="button" class="font-bold text-brass-deep underline underline-offset-4" (click)="ask()">Tell us yours</button></p>
    </div>
    <p class="mt-2 text-[0.72rem] text-ink/70">{{ status.note }}</p>
  </div>
</section>
