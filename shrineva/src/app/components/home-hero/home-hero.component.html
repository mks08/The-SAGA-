<section id="top" data-rail="Top" class="relative isolate overflow-hidden bg-gradient-to-b from-paper-2 via-paper to-paper" aria-label="SHRINEVA, commercial and mixed-use space in Bada Lalpur, Varanasi">
  <div class="pointer-events-none absolute -left-24 top-10 -z-10 size-[26rem] rounded-full bg-brass/10 blur-[110px]" aria-hidden="true"></div>
  <div class="pointer-events-none absolute -right-16 bottom-16 -z-10 size-[18rem] rounded-full bg-sand/40 blur-[100px]" aria-hidden="true"></div>

  <div class="container-srineva grid items-center gap-7 pb-8 pt-[calc(var(--nav-h)+1.25rem)] md:pb-10 lg:grid-cols-[1.02fr_1fr] lg:gap-12 lg:pt-[calc(var(--nav-h)+1.5rem)]">
    <!-- Copy -->
    <div class="max-w-xl">
      <div class="mb-4 flex flex-wrap items-center gap-2 animate-rise">
        <span class="badge-vda" *ngIf="property.approvals.vda.show" [attr.title]="property.approvals.vda.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
          {{ property.approvals.vda.label }}
        </span>
        <span class="inline-flex items-center gap-2 rounded-full border border-ink/12 bg-white/70 px-3 py-1 font-mono text-[0.64rem] uppercase tracking-[0.12em] text-ink/70">
          <span class="live-dot" aria-hidden="true"></span> Under construction · Handover Mar 2027
        </span>
      </div>

      <h1 class="animate-rise [animation-delay:80ms]">
        <span class="block font-display text-[clamp(2.6rem,6.2vw,4.4rem)] leading-[0.95] tracking-[0.1em] text-ink">SHRINEVA</span>
        <span class="mt-3 block font-display text-[clamp(1.35rem,2.7vw,2rem)] leading-[1.12] text-ink/85">Commercial <em class="text-brass-deep">&amp; mixed-use</em> space in Bada Lalpur, Varanasi</span>
      </h1>

      <p class="mt-4 max-w-md text-[1rem] leading-relaxed text-ink/70 animate-rise [animation-delay:160ms]">
        Parking + 3 whole floors on a 24 m road, 60–70 m from the Apollo hospital and NIFT sites.
      </p>

      <div class="mt-6 flex flex-col gap-3 animate-rise [animation-delay:240ms] sm:flex-row sm:items-center">
        <a routerLink="/walkthrough" class="btn-primary" (click)="track('walkthrough_click')">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
          Walk through in 3D <span class="arrow" aria-hidden="true">→</span>
        </a>
        <button type="button" class="btn-outline" id="hero-visit-btn" (click)="openPopup()">Schedule a visit</button>
      </div>

      <dl class="mt-6 flex gap-7 border-t border-ink/10 pt-4 animate-rise [animation-delay:320ms] sm:gap-10">
        <div *ngFor="let s of stats">
          <dt class="font-display text-[clamp(1.4rem,2.6vw,1.9rem)] leading-none text-ink"><span [appCountUp]="s.value" [countSuffix]="s.suffix">{{ s.value }}{{ s.suffix }}</span></dt>
          <dd class="mt-1 font-mono text-[0.6rem] uppercase tracking-[0.14em] text-ink/70">{{ s.label }}</dd>
        </div>
      </dl>
    </div>

    <!-- Render -->
    <figure class="relative animate-rise [animation-delay:200ms]">
      <div class="overflow-hidden rounded-[1.6rem] border border-ink/10 bg-white p-1.5 shadow-lift">
        <img src="assets/images/hero/hero-golden-1000.webp"
             srcset="assets/images/hero/hero-golden-1000.webp 1000w, assets/images/hero/hero-golden-2000.webp 2000w"
             sizes="(min-width: 1024px) 560px, 92vw" width="1000" height="667" fetchpriority="high" decoding="async"
             alt="Indicative render of the SHRINEVA façade at golden hour: Parking + 3 floors with glass fronts and timber screens, Bada Lalpur, Varanasi"
             class="aspect-[16/10] w-full rounded-[1.2rem] object-cover object-[50%_40%] lg:aspect-[4/3] lg:max-h-[350px]">
      </div>
      <figcaption class="absolute bottom-4 left-4 rounded-full bg-white/90 px-3 py-1 font-mono text-[0.58rem] uppercase tracking-[0.14em] text-ink/70 backdrop-blur">Indicative render</figcaption>
    </figure>
  </div>
</section>
