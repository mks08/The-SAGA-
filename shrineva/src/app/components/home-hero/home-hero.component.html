<section id="top" data-rail="Top" class="relative isolate z-[2] bg-gradient-to-b from-paper-2 via-paper to-paper" aria-label="SHRINEVA, commercial space for lease in Bada Lalpur, Varanasi">
  <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden" aria-hidden="true"><div class="absolute -left-24 top-10 size-[34rem] rounded-full glow-brass-10"></div></div>

  <div class="container-srineva pb-0 pt-[calc(var(--nav-h)+1rem)] lg:pt-[calc(var(--nav-h)+2rem)]">
    <div class="grid items-stretch gap-6 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] lg:gap-10">

      <!-- Picture first on phones; second column on desktop -->
      <figure class="relative order-1 lg:order-2">
        <div class="relative h-full overflow-hidden rounded-[1.6rem] border border-ink/10 bg-ink-3 shadow-lift">
          <div class="relative aspect-[4/3.1] w-full sm:aspect-[16/10] lg:aspect-auto lg:h-full lg:min-h-[34rem]">
            <div class="absolute inset-0 overflow-hidden" aria-hidden="false">
              <div class="absolute inset-0" style="transform: scale(1.12)" [appParallax]="0.05">
                <img [src]="image.src960" [attr.srcset]="image.src960 + ' 960w, ' + image.src1920 + ' 1920w'" sizes="(min-width: 1024px) 58vw, 100vw"
                     [alt]="image.alt" width="1920" height="995" loading="eager" decoding="async" fetchpriority="high"
                     class="hero-img absolute inset-0 h-full w-full object-cover object-[54%_58%]">
              </div>
            </div>
            <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-[#1b1714]/55 via-transparent to-transparent" aria-hidden="true"></div>

            <!-- Press the picture to enlarge it (the chips and the caption below let the tap through) -->
            <button type="button" class="absolute inset-0 cursor-zoom-in focus-visible:[border-radius:1.6rem] focus-visible:[outline-offset:-6px]" (click)="enlarge()" aria-haspopup="dialog" aria-label="Enlarge the 3D render of the building"></button>
            <span class="pointer-events-none absolute left-3 top-3 inline-flex items-center gap-1.5 rounded-full bg-[#1b1714]/70 p-2 text-[#f6f1e8] backdrop-blur sm:py-1.5 sm:pl-2.5 sm:pr-3.5 md:left-4 md:top-4" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
              <span class="hidden font-mono text-[0.7rem] uppercase tracking-[0.14em] sm:inline">Enlarge</span>
            </span>

            <!-- Orientation chip -->
            <div class="pointer-events-none absolute right-3 top-3 inline-flex items-center gap-2 rounded-full bg-[#1b1714]/70 py-1.5 pl-2 pr-3.5 text-[#f6f1e8] backdrop-blur md:right-4 md:top-4">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5" opacity=".5"/><path d="M12 5l3 8h-6z" fill="currentColor"/></svg>
              <span class="font-mono text-[0.7rem] uppercase tracking-[0.14em]">North-facing · 24 m road</span>
            </div>

            <!-- Where it is: a slim chip on the road strip at the foot of the picture (from 640 px up). On phones the caption sits under the picture instead, so the whole building stays visible. -->
            <div class="pointer-events-none absolute bottom-3 left-4 hidden max-w-[22rem] flex-col gap-0.5 rounded-xl bg-white/90 px-3.5 py-2.5 backdrop-blur sm:flex md:bottom-4">
              <p class="font-display text-[1.02rem] leading-snug text-ink">Plot D-15, Lalpur Housing Scheme, Bada Lalpur</p>
              <p class="font-mono text-[0.7rem] uppercase tracking-[0.14em] text-ink/70">Indicative 3D render</p>
            </div>
          </div>
          <figcaption class="flex flex-col gap-0.5 bg-ink-3 px-4 py-2.5 text-[#f6f1e8] sm:hidden">
            <span class="font-display text-[1rem] leading-snug">Plot D-15, Lalpur Housing Scheme, Bada Lalpur</span>
            <span class="font-mono text-[0.7rem] uppercase tracking-[0.14em] text-[#f6f1e8]/75">Indicative 3D render</span>
          </figcaption>
        </div>
      </figure>

      <!-- Text -->
      <div class="order-2 flex flex-col justify-center py-2 lg:order-1 lg:py-8">
        <div class="mb-4 flex flex-wrap items-center gap-2 animate-rise">
          <span class="badge-vda" *ngIf="property.approvals.vda.show" [attr.title]="property.approvals.vda.title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
            {{ property.approvals.vda.label }}
          </span>
          <span class="inline-flex items-center gap-2 rounded-full border border-ink/12 bg-white/70 px-3 py-1 font-mono text-[0.7rem] uppercase tracking-[0.12em] text-ink/70">
            <span class="live-dot" aria-hidden="true"></span> Under construction
          </span>
        </div>
        <h1 class="animate-rise [animation-delay:80ms]">
          <span class="sr-only">SHRINEVA: </span>
          <app-brand-logo variant="wordmark" [decorative]="true" class="block w-[clamp(14rem,24vw,21rem)]"></app-brand-logo>
          <span class="mt-4 block font-display text-[clamp(1.6rem,3vw,2.5rem)] leading-[1.1] text-ink">{{ hero.title }}</span>
        </h1>
        <p class="mt-4 max-w-xl text-[1.02rem] leading-relaxed text-ink/75 animate-rise [animation-delay:160ms]">{{ hero.sub }}</p>

        <div class="mt-6 flex flex-col gap-3 animate-rise [animation-delay:240ms] sm:flex-row sm:flex-wrap sm:items-center">
          <button type="button" class="btn-primary" id="hero-visit-btn" (click)="openPopup()">Schedule a visit <span class="arrow" aria-hidden="true">→</span></button>
          <button type="button" class="btn-outline" id="hero-brochure-btn" (click)="openBrochure()" aria-haspopup="dialog">Download brochure <span aria-hidden="true">↓</span></button>
        </div>

        <!-- Contact line: always in the first screen -->
        <ul class="mt-5 flex flex-wrap items-center gap-x-5 gap-y-1 animate-rise [animation-delay:300ms]" aria-label="Contact the leasing team">
          <li><a [href]="'tel:' + property.contact.phoneE164" class="inline-flex min-h-[44px] items-center gap-2 text-[0.92rem] font-semibold text-ink hover:text-brass-deep" data-track-source="hero">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
            {{ property.contact.phoneDisplay }}</a></li>
          <li><a [href]="waHref" target="_blank" rel="noopener" class="inline-flex min-h-[44px] items-center gap-2 text-[0.92rem] font-semibold text-[#0b7a3b] hover:underline" data-track-source="hero">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9s-.5-.1-.7.1-.8.9-.9 1.1-.3.2-.6.1a7.6 7.6 0 0 1-3.8-3.3c-.3-.5.3-.5.8-1.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.7 3.7 0 0 0-1.1 2.7 6.4 6.4 0 0 0 1.4 3.4 14.6 14.6 0 0 0 5.6 4.9c2.1.9 2.9.9 3.9.8a3.3 3.3 0 0 0 2.2-1.6 2.7 2.7 0 0 0 .2-1.6c-.1-.1-.3-.2-.7-.4zM12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/></svg>
            WhatsApp</a></li>
          <li><a [href]="'mailto:' + property.contact.publicEmail" class="inline-flex min-h-[44px] items-center gap-2 text-[0.92rem] font-semibold text-ink hover:text-brass-deep" data-track-source="hero">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            {{ property.contact.publicEmail }}</a></li>
        </ul>
      </div>
    </div>

    <!-- The six facts a tenant checks first -->
    <dl class="relative z-10 mt-6 grid grid-cols-2 overflow-hidden rounded-3xl border border-ink/10 bg-white shadow-soft sm:grid-cols-3 lg:-mb-9 lg:grid-cols-6" aria-label="SHRINEVA at a glance">
      <div *ngFor="let f of facts; let i = index" appReveal [style.--i]="i" class="spot group relative border-b border-r border-ink/10 p-3.5 last:border-r-0 md:p-4 lg:border-b-0" appSpotlight>
        <dt class="flex items-center gap-1.5 font-mono text-[0.7rem] uppercase tracking-[0.13em] text-brass-deep">
          <ng-container [ngSwitch]="f.icon">
            <svg *ngSwitchCase="'frontage'" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M3 8v8M21 8v8M7 10l-4 2 4 2M17 10l4 2-4 2"/></svg>
            <svg *ngSwitchCase="'road'" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3L4 21M16 3l4 18M12 4v3M12 11v3M12 18v3"/></svg>
            <svg *ngSwitchCase="'parking'" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 17V8h3a2.5 2.5 0 0 1 0 5h-3"/></svg>
            <svg *ngSwitchCase="'lift'" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 3v18M9 9l-1.5-2L6 9M16 15l1.5 2L19 15" transform="translate(-0.5 0)"/></svg>
            <svg *ngSwitchCase="'floor'" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5"/></svg>
            <svg *ngSwitchCase="'fire'" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>
          </ng-container>
          {{ f.label }}
        </dt>
        <dd class="mt-1.5">
          <span class="block font-display text-[clamp(1.7rem,2.6vw,2.2rem)] leading-none text-ink">
            <ng-container *ngIf="f.value !== undefined; else plain">{{ f.prefix }}<span [appCountUp]="f.value!">{{ f.value | number: '1.0-0' }}</span>{{ f.suffix }}</ng-container>
            <ng-template #plain>{{ f.text }}</ng-template>
          </span>
          <span class="mt-1 block text-[0.76rem] leading-snug text-ink/70">{{ f.sub }}</span>
        </dd>
      </div>
    </dl>
  </div>
</section>
