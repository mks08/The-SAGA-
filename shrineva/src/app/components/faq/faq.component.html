<section id="faq" data-rail="FAQ" class="relative bg-paper py-16 md:py-24" [class.!pt-4]="!showIntro" aria-labelledby="faq-title">
  <div class="container-srineva grid gap-10 lg:grid-cols-[0.8fr_1.2fr] lg:gap-16">
    <div *ngIf="showIntro" appReveal class="lg:sticky lg:top-28 lg:self-start">
      <span class="eyebrow">FAQ</span>
      <h2 id="faq-title" class="font-display text-display-lg text-ink">Questions, <em class="text-brass-deep">answered.</em></h2>
      <p class="mt-4 max-w-sm text-[1.02rem] leading-relaxed text-ink/70">What occupiers usually ask before a site visit.</p>
      <div class="mt-6 flex flex-col gap-3 sm:flex-row lg:flex-col xl:flex-row">
        <button type="button" class="btn-primary" (click)="openPopup()">Enquire now <span class="arrow" aria-hidden="true">→</span></button>
        <a [href]="waHref" class="btn-whatsapp" target="_blank" rel="noopener">Ask on WhatsApp</a>
      </div>
      <a *ngIf="preview" routerLink="/faq" class="text-link mt-3">All questions →</a>
    </div>
    <h2 *ngIf="!showIntro" id="faq-title" class="sr-only">Frequently asked questions</h2>

    <div class="divide-y divide-ink/10 border-y border-ink/10" [class.lg:col-span-2]="!showIntro">
      <div *ngFor="let q of faqs; let i = index" appReveal [style.--i]="i % 4">
        <h3 class="!font-sans">
          <button type="button" class="flex min-h-[64px] w-full items-center justify-between gap-6 py-4 text-left" (click)="toggle(i)"
                  [attr.aria-expanded]="open === i" [attr.aria-controls]="'faq-a-' + i" [id]="'faq-q-' + i">
            <span class="text-[1.02rem] font-bold leading-snug text-ink md:text-[1.1rem]">{{ q.q }}</span>
            <span class="relative grid size-9 shrink-0 place-items-center rounded-full border border-ink/20 text-ink transition-all duration-300"
                  [ngClass]="open === i ? 'rotate-45 border-brass-deep bg-brass/15' : ''" aria-hidden="true">
              <span class="absolute h-px w-3.5 bg-current"></span><span class="absolute h-3.5 w-px bg-current"></span>
            </span>
          </button>
        </h3>
        <div [id]="'faq-a-' + i" role="region" [attr.aria-labelledby]="'faq-q-' + i" class="grid transition-[grid-template-rows] duration-500 ease-out" [ngClass]="open === i ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'">
          <div class="overflow-hidden"><p class="max-w-2xl pb-5 text-[0.98rem] leading-relaxed text-ink/75" [attr.inert]="open === i ? null : ''">{{ q.a }}</p></div>
        </div>
      </div>
    </div>
  </div>
</section>
