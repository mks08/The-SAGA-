<main role="main" id="main-content">
  <app-home-hero></app-home-hero>

  <!-- Building explorer: tap a floor on the building; its plan, area and details open beside it -->
  <app-building-explorer></app-building-explorer>

  <!-- The brochure, once the visitor knows what the building is -->
  <app-brochure-card [compact]="true"></app-brochure-card>

  <!-- 3D walkthrough: stop by stop, with tools -->
  <app-guided-tour variant="embed"></app-guided-tour>

  <!-- Project progress: stages, targeted project completion, and the real site photographs -->
  <app-project-timeline></app-project-timeline>

  <!-- Safety, access and building facts -->
  <app-building-specs></app-building-specs>

  <!-- Location: the answer-first block, satellite map and distances -->
  <app-place-map [heading]="answer.q" [lead]="answer.a"></app-place-map>

  <section class="bg-paper py-12 md:py-16" aria-labelledby="paths-title" id="business-paths" data-rail="Uses">
    <div class="container-srineva">
      <div appReveal>
        <span class="eyebrow">Find your space</span>
        <h2 id="paths-title" class="font-display text-display-md text-ink">Which business are you leasing for?</h2>
      </div>
      <ul class="mt-6 grid gap-3 md:grid-cols-3">
        <li *ngFor="let l of landing; let i = index" appReveal [style.--i]="i">
          <a [routerLink]="'/' + l.path" appSpotlight class="spot group block h-full rounded-3xl border border-ink/10 bg-white p-5 transition-[border-color,box-shadow,transform] duration-300 hover:-translate-y-0.5 hover:border-brass-deep/60 hover:shadow-lift md:p-6">
            <h3 class="font-display text-[1.35rem] leading-snug text-ink">{{ l.navLabel }}</h3>
            <p class="mt-1.5 text-[0.92rem] leading-relaxed text-ink/75">{{ l.sub }}</p>
            <span class="mt-3 inline-flex items-center gap-1 text-[0.88rem] font-bold text-brass-deep">See the space <span class="transition-transform group-hover:translate-x-1" aria-hidden="true">→</span></span>
          </a>
        </li>
      </ul>
    </div>
  </section>

  <app-faq [items]="faqs" heading="Leasing at SHRINEVA: your questions answered" headingId="home-faq-title"></app-faq>
  <app-contact></app-contact>
</main>
