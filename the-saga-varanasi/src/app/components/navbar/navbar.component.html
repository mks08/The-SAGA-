<header
  class="navbar"
  [class.scrolled]="scrolled"
  [class.menu-open]="menuOpen"
  role="banner">

  <!-- Scroll progress -->
  <div class="scroll-progress" [style.width.%]="scrollProgress"></div>

  <div class="nav-inner container-srineva">
    <!-- Logo -->
    <a class="nav-logo" routerLink="/" (click)="closeMenu()" aria-label="SHRINEVA — Home">
      <img class="nav-logo-img" [src]="property.images.logo" alt="" width="160" height="160">
      <div class="logo-text">
        <span class="logo-main">SHRINEVA</span>
        <span class="logo-sub">Commercial &amp; Mixed-Use Spaces</span>
      </div>
    </a>

    <!-- Desktop Links -->
    <nav class="nav-links" role="navigation" aria-label="Main Navigation">
      <a *ngFor="let link of navLinks"
         [routerLink]="link.path"
         routerLinkActive="active">
        {{ link.label }}
      </a>
    </nav>

    <!-- Nav CTAs -->
    <div class="nav-actions">
      <a [href]="waHref" class="nav-phone" target="_blank" rel="noopener" aria-label="WhatsApp SHRINEVA leasing">
        WhatsApp
      </a>
      <button id="nav-book-cta" class="nav-book-btn" type="button" (click)="openPopup()">
        Schedule a Site Visit
      </button>
    </div>

    <!-- Hamburger -->
    <button
      class="hamburger"
      [class.open]="menuOpen"
      (click)="toggleMenu()"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Drawer -->
  <div class="mobile-drawer" [class.open]="menuOpen" [attr.aria-hidden]="!menuOpen">
    <nav class="drawer-links" role="navigation">
      <a *ngFor="let link of navLinks; let i = index"
         [routerLink]="link.path"
         routerLinkActive="active"
         (click)="closeMenu()"
         [style.animationDelay]="(i * 0.06) + 's'">
        <span class="drawer-num">0{{ i + 1 }}</span>
        {{ link.label }}
      </a>
    </nav>
    <div class="drawer-cta">
      <a [href]="waHref" class="drawer-whatsapp" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
        </svg>
        WhatsApp Leasing
      </a>
      <button class="drawer-book" (click)="openPopup()">Schedule a Site Visit →</button>
    </div>
  </div>
</header>
