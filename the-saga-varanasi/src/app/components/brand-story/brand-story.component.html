<section class="section-py story-section" id="story-section" aria-label="About SHRINEVA">
  <div class="container-srineva">
    <div class="story-inner reveal">
      <img class="story-logo" [src]="property.images.logo" alt="SHRINEVA — Commercial & Mixed-Use Spaces, Bada Lalpur, Varanasi" width="480" height="480">
      <span class="section-eyebrow">A Long-Term View</span>
      <h2 class="section-heading">Family-Led. Built for <em>Business</em>.</h2>
      <p class="story-verse">
        Built with a long-term view of Varanasi's evolving commercial landscape, SHRINEVA combines a family-led vision with a practical approach to modern business space.
      </p>
      <p class="story-sg">{{ property.brand.legalNote }}</p>
    </div>
  </div>
</section>
