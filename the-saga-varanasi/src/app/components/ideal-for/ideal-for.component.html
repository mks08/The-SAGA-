<section class="section-py" id="ideal-for-section" aria-label="Ideal For">
  <div class="container-saga">
    <div class="sec-header reveal">
      <span class="section-eyebrow">Perfect For</span>
      <h2 class="section-heading">What Can Be <em>Accommodated</em></h2>
      <p class="section-sub">3,500 sq ft per floor — space enough to bring any commercial vision to life.</p>
      <div class="gold-divider"></div>
    </div>

    <div class="ideal-grid">
      <div class="ideal-card reveal"
           *ngFor="let item of accommodations; let i = index"
           [style.transitionDelay]="(i * 0.06) + 's'">
        <div class="ic-icon">{{ item.icon }}</div>
        <div class="ic-body">
          <h3>{{ item.label }}</h3>
          <p>{{ item.description }}</p>
        </div>
        <div class="ic-arrow">→</div>
      </div>
    </div>

    <div class="ideal-cta reveal delay-300">
      <p>Have a different requirement?</p>
      <button class="btn-primary" (click)="openPopup()">Tell Us What You Need →</button>
    </div>
  </div>
</section>
