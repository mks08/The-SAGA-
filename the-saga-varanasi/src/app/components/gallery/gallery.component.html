<section class="section-py gallery-section" id="gallery-section" aria-label="Gallery" [class.no-intro]="!showIntro">
  <div class="container-srineva">
    <div class="gal-head" *ngIf="showIntro">
      <div>
        <span class="section-eyebrow">Gallery</span>
        <h2 class="section-heading">The building, <em>as designed</em></h2>
        <p class="section-sub">Façade, stilt court and lift lobby. Indicative 3D visualisations; finishes and surroundings are illustrative and subject to change.</p>
      </div>
      <a *ngIf="showPageLink" routerLink="/gallery" class="btn-outline gal-all">View all {{ total }} →</a>
    </div>

    <div class="gal-filters" role="tablist" aria-label="Filter images" *ngIf="!isHome">
      <button type="button" role="tab" *ngFor="let g of groups" [class.active]="g === active" [attr.aria-selected]="g === active" (click)="select(g)">{{ g }}</button>
    </div>

    <ul class="gal-grid" [class.home]="isHome">
      <li *ngFor="let r of items; let i = index" [class.hero]="i === 0">
        <button type="button" (click)="open(i)" [attr.aria-label]="'Open ' + r.title">
          <img [src]="i === 0 ? r.src : r.thumb" [alt]="r.alt" [attr.width]="i === 0 ? r.width : 560" [attr.height]="i === 0 ? r.height : (r.height * 560 / r.width | number:'1.0-0')" loading="lazy" decoding="async">
          <span class="gal-cap"><em>{{ r.group }}</em><strong>{{ r.title }}</strong></span>
        </button>
      </li>
    </ul>

    <p class="gal-note">{{ property.legal.renderDisclaimer }}</p>
  </div>
</section>

<app-lightbox [items]="items" [index]="lightboxIndex" [disclaimer]="'Indicative 3D visualisation. Subject to change.'"
              (indexChange)="lightboxIndex = $event" (closed)="lightboxIndex = null"></app-lightbox>
